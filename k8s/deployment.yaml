apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
      annotations:
         prometheus.io/scrape: "true"
         prometheus.io/port: "80"
    spec:
      containers:
      - name: portfolio
        image: adityam18/portfolio-img:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80